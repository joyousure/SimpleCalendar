name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies & Capacitor plugins
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/app@^6.0.0 @capacitor/status-bar@^6.0.0 --legacy-peer-deps

      - name: Setup Entry and Safe Area
        run: |
          cat << 'EOF' > setup.py
          import os, re, glob

          style = '<style>:root{color-scheme:light dark}html{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;overflow:hidden!important;overscroll-behavior:none!important;padding-top:env(safe-area-inset-top)!important;padding-bottom:env(safe-area-inset-bottom)!important;box-sizing:border-box!important;background:#fff;transition:background .2s}@media(prefers-color-scheme:dark){html{background:#121212}}body,#root{width:100%!important;height:100%!important;margin:0!important;padding:0!important;box-sizing:border-box!important}body{overflow:hidden!important}#root{overflow-y:auto!important;overflow-x:hidden!important;-webkit-overflow-scrolling:touch}</style><script>setInterval(()=>{const r=document.getElementById("root");if(!r)return;for(const e of[r.firstElementChild,document.body]){if(!e)continue;const b=getComputedStyle(e).backgroundColor;if(b&&b!=="rgba(0, 0, 0, 0)"&&b!=="transparent"){document.documentElement.style.backgroundColor=b;break}}},300)</script>'

          boot = '''<script>(function(){var KEY="boot_fail_count";setTimeout(function(){if(document.readyState==="loading")return;var root=document.getElementById("root");if(root&&root.children.length>0){try{localStorage.removeItem(KEY);}catch(e){}return;}try{var c=parseInt(localStorage.getItem(KEY)||"0",10);localStorage.setItem(KEY,String(c+1));}catch(e){}var d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#fff;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;padding:24px;";d.innerHTML='<p style="color:#333;font-size:16px;margin-bottom:16px">应用启动遇到问题</p><button id="__r" style="padding:10px 28px;font-size:16px;border:none;border-radius:8px;background:#1677ff;color:#fff;cursor:pointer">重新加载</button>';document.body.appendChild(d);document.getElementById("__r").onclick=function(){location.reload();};},10000);})();</script>'''

          vroot = "."
          for c in ["vite.config.ts", "vite.config.js"]:
              if os.path.exists(c):
                  m = re.search(r'root\s*:\s*["\']([^"\']+)["\']', open(c, encoding="utf-8").read())
                  if m: vroot = m.group(1).strip("/")
                  break
          tdir = vroot if os.path.exists(vroot) else "."
          thtml = os.path.join(tdir, "index.html")
          if not os.path.exists(thtml):
              es = [e for e in glob.glob("**/*.tsx", recursive=True)+glob.glob("**/*.jsx", recursive=True) if "node_modules" not in e and ("main" in e or "index" in e)]
              en = os.path.relpath(es[0] if es else "src/main.tsx", tdir).replace("\\", "/")
              open(thtml, "w", encoding="utf-8").write(f'<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/><title>Calendar</title>{style}{boot}</head><body><div id="root"></div><script type="module" src="/{en}"></script></body></html>')
          else:
              h = open(thtml, encoding="utf-8").read()
              if "viewport-fit=cover" not in h:
                  if re.search(r'<meta\s+name="viewport"[^>]*>', h):
                      h = re.sub(r'<meta\s+name="viewport"[^>]*>',
                                 '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">',
                                 h, count=1)
              if "boot_fail_count" not in h:
                  h = h.replace("</head>", boot + "</head>", 1)
              h = h.replace("</head>", style + "</head>", 1)
              open(thtml, "w", encoding="utf-8").write(h)
          EOF
          python3 setup.py && rm setup.py

      # ========== JS 桥接：toast 单例化 + isExiting 标志 ==========
      - name: Inject Capacitor native bridge
        run: |
          TARGET_DIR="src"
          [ ! -d "$TARGET_DIR" ] && TARGET_DIR="."

          cat << 'TS' > "$TARGET_DIR/capacitor-native-bridge.ts"
          import { App } from '@capacitor/app';
          import { StatusBar, Style } from '@capacitor/status-bar';

          const DARK_BG = '#121212';
          const LIGHT_BG = '#FFFFFF';
          const isDarkMode = () => window.matchMedia('(prefers-color-scheme: dark)').matches;

          function readHeaderBg(): string {
            const header = document.querySelector(
              '[data-sticky], header, [class*="header"], [class*="topbar"], [class*="top-bar"]'
            ) as HTMLElement | null;
            if (!header) return isDarkMode() ? DARK_BG : LIGHT_BG;
            const bg = getComputedStyle(header).backgroundColor;
            if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') return bg;
            return isDarkMode() ? DARK_BG : LIGHT_BG;
          }

          function isDarkBg(bg: string): boolean {
            const m = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (m) return (+m[1] * 0.299 + +m[2] * 0.587 + +m[3] * 0.114) < 128;
            const hx = bg.match(/^#([0-9a-f]{6})$/i);
            if (hx) {
              const r = parseInt(hx[1].slice(0, 2), 16);
              const g = parseInt(hx[1].slice(2, 4), 16);
              const b = parseInt(hx[1].slice(4, 6), 16);
              return (r * 0.299 + g * 0.587 + b * 0.114) < 128;
            }
            return isDarkMode();
          }

          async function syncStatusBar() {
            try {
              const bg = readHeaderBg();
              await StatusBar.setBackgroundColor({ color: bg });
              await StatusBar.setStyle({ style: isDarkBg(bg) ? Style.Dark : Style.Light });
            } catch (e) {}
          }

          let pinPending = false;
          function pinTopHeader() {
            if (pinPending) return;
            pinPending = true;
            requestAnimationFrame(() => {
              pinPending = false;
              const candidates = document.querySelectorAll(
                '[data-sticky], header, [class*="header"], [class*="topbar"], [class*="top-bar"]'
              );
              for (const el of Array.from(candidates)) {
                const h = el as HTMLElement;
                if (h.dataset.nativePinned === 'true') continue;
                const rect = h.getBoundingClientRect();
                const isExplicit = h.hasAttribute('data-sticky');
                const isHeuristic =
                  rect.height >= 28 && rect.height <= 140 &&
                  rect.top >= -2 && rect.top <= 48 &&
                  rect.bottom < window.innerHeight * 0.4 &&
                  rect.width >= window.innerWidth * 0.8;
                if (!isExplicit && !isHeuristic) continue;

                const computed = getComputedStyle(h);
                if (computed.position !== 'fixed' && computed.position !== 'sticky') {
                  const prev = h.previousElementSibling;
                  if (!prev || !prev.classList.contains('native-header-spacer')) {
                    const spacer = document.createElement('div');
                    spacer.className = 'native-header-spacer';
                    spacer.style.cssText = `height:${rect.height}px;width:100%;flex-shrink:0;`;
                    h.parentElement?.insertBefore(spacer, h);
                  }
                }
                if (computed.backgroundColor === 'rgba(0, 0, 0, 0)' || computed.backgroundColor === 'transparent') {
                  h.style.backgroundColor = isDarkMode() ? DARK_BG : LIGHT_BG;
                }
                h.style.position = 'fixed';
                h.style.top = '0px';
                h.style.left = '0px';
                h.style.right = '0px';
                h.style.width = '100%';
                h.style.marginTop = '0px';
                h.style.zIndex = '50';
                h.style.willChange = 'transform';
                h.style.transform = 'translateZ(0)';
                h.dataset.nativePinned = 'true';
                break;
              }
              syncStatusBar();
            });
          }

          // ========== 返回键：toast 单例 + isExiting 标志 ==========
          let lastBack = 0;
          let isExiting = false;
          let exitToast: HTMLElement | null = null;

          function removeExitToast() {
            if (exitToast && exitToast.parentNode) {
              exitToast.parentNode.removeChild(exitToast);
            }
            exitToast = null;
          }

          function showExitToast() {
            // 单例：先移除旧的，避免重叠
            removeExitToast();
            exitToast = document.createElement('div');
            exitToast.id = 'native-exit-toast';
            exitToast.textContent = '再按一次退出应用';
            Object.assign(exitToast.style, {
              position: 'fixed',
              bottom: '84px',
              left: '50%',
              transform: 'translateX(-50%)',
              background: 'rgba(0,0,0,0.75)',
              color: '#fff',
              padding: '8px 16px',
              borderRadius: '20px',
              fontSize: '14px',
              zIndex: '99999',
              pointerEvents: 'none'
            });
            document.body.appendChild(exitToast);
            setTimeout(() => {
              if (exitToast && exitToast.parentNode) {
                exitToast.parentNode.removeChild(exitToast);
              }
              exitToast = null;
            }, 1500);
          }

          App.addListener('backButton', (info: { canGoBack: boolean }) => {
            // 已在退出流程中，忽略后续所有按键
            if (isExiting) return;

            // 优先级 1：关闭弹窗
            const dlg = document.querySelector(
              '[role="dialog"]:not([hidden]),.ant-modal-wrap:not([style*="display: none"]),' +
              '.modal.show,.MuiDialog-root,.MuiModal-root,.MuiDrawer-root,' +
              '[class*="modal"]:not([hidden]),[class*="dialog"]:not([hidden]),[class*="drawer"]:not([hidden])'
            ) as HTMLElement | null;
            if (dlg) {
              const btn = dlg.querySelector(
                '[aria-label="Close"],[aria-label="关闭"],[data-dismiss="modal"],' +
                '.ant-modal-close,.MuiIconButton-root,.close,[class*="close"]'
              ) as HTMLElement | null;
              if (btn) { btn.click(); return; }
              document.dispatchEvent(new KeyboardEvent('keydown', {
                key: 'Escape', code: 'Escape', keyCode: 27, bubbles: true
              }));
              return;
            }

            // 优先级 2：还能后退
            if (info.canGoBack) { window.history.back(); return; }

            // 优先级 3：首页，双击退出
            const now = Date.now();
            if (now - lastBack < 2000) {
              isExiting = true;
              removeExitToast();
              // exitApp 返回 Promise，失败时重置标志允许重试
              Promise.resolve(App.exitApp()).catch(() => {
                isExiting = false;
                lastBack = 0;
              });
              return;
            }

            // 首次按键：显示提示
            lastBack = now;
            showExitToast();
          });

          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncStatusBar);
          window.addEventListener('popstate', pinTopHeader);
          window.addEventListener('hashchange', pinTopHeader);

          const observer = new MutationObserver(pinTopHeader);
          observer.observe(document.documentElement, {
            childList: true, subtree: true,
            attributes: true, attributeFilter: ['class', 'style', 'data-theme']
          });

          async function init() {
            pinTopHeader();
            syncStatusBar();
            [100, 500, 1500].forEach(t => setTimeout(() => { pinTopHeader(); syncStatusBar(); }, t));
          }
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
          } else {
            init();
          }
          TS

          for entry in src/main.tsx src/main.ts src/index.tsx src/index.ts index.tsx index.ts main.tsx main.ts src/main.jsx src/index.jsx index.jsx main.jsx; do
            if [ -f "$entry" ]; then
              grep -q 'capacitor-native-bridge' "$entry" || sed -i '1i import "./capacitor-native-bridge";' "$entry"
              echo "Injected bridge into $entry"
              break
            fi
          done

      - name: Build web
        run: npm run build

      - name: Initialize Capacitor 6 & Android platform
        run: |
          WEB_DIR="dist"
          if [ -d "build" ]; then WEB_DIR="build"; elif [ -d "out" ]; then WEB_DIR="out"; fi
          cat << EOF > capacitor.config.json
          {
            "appId": "com.example.calendar",
            "appName": "Calendar",
            "webDir": "$WEB_DIR"
          }
          EOF
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Native WindowInsets
        run: |
          mkdir -p android/app/src/main/java/com/example/calendar
          cat << 'JAVA' > android/app/src/main/java/com/example/calendar/MainActivity.java
          package com.example.calendar;

          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  int nightModeFlags = getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK;
                  boolean isDark = nightModeFlags == Configuration.UI_MODE_NIGHT_YES;
                  int bgColor = isDark ? Color.parseColor("#121212") : Color.parseColor("#FFFFFF");

                  getWindow().getDecorView().setBackgroundColor(bgColor);
                  getWindow().setStatusBarColor(bgColor);
                  getWindow().setNavigationBarColor(bgColor);

                  WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller != null) {
                      controller.setAppearanceLightStatusBars(!isDark);
                      controller.setAppearanceLightNavigationBars(!isDark);
                  }

                  View contentView = findViewById(android.R.id.content);
                  ViewCompat.setOnApplyWindowInsetsListener(contentView, (v, windowInsets) -> {
                      Insets insets = windowInsets.getInsets(WindowInsetsCompat.Type.systemBars());
                      ViewGroup.MarginLayoutParams mlp = (ViewGroup.MarginLayoutParams) v.getLayoutParams();
                      mlp.topMargin = insets.top;
                      mlp.bottomMargin = insets.bottom;
                      mlp.leftMargin = insets.left;
                      mlp.rightMargin = insets.right;
                      v.setLayoutParams(mlp);
                      return WindowInsetsCompat.CONSUMED;
                  });
              }
          }
          JAVA

          MF="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MF" ] && ! grep -q 'enableOnBackInvokedCallback' "$MF"; then
            sed -i 's/<application/<application android:enableOnBackInvokedCallback="true"/' "$MF"
            echo "Manifest patched: enableOnBackInvokedCallback"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/gradle_build.log 2>&1
          EXIT=$?

          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ $EXIT -ne 0 ] || [ ! -f "$APK" ]; then
            echo "========== BUILD FAILED (exit $EXIT) =========="
            echo "--- What went wrong ---"
            grep -A 30 "What went wrong" /tmp/gradle_build.log || true
            echo "--- error: lines ---"
            grep -B 2 -A 6 "error:" /tmp/gradle_build.log | head -60 || true
            echo "--- Last 40 lines ---"
            tail -n 40 /tmp/gradle_build.log
            exit 1
          fi
          echo "APK generated: $(ls -lh $APK)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Calendar-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30